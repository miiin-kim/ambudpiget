
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재정관리">
<meta name="theme-color" content="#F0F2F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>재정관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#F0F2F8;--surface:#fff;--surface2:#E8EBF4;
 --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
 --text:#1A1A2E;--text2:#5A5A7A;--text3:#9090AA;
 --green:#1A7A40;--green-bg:#E0F5EB;
 --blue:#1A5BA8;--blue-bg:#E4EEF8;
 --red:#B02020;--red-bg:#FDEAEA;
 --purple:#5A20CC;--purple-bg:#F0EAFF;
 --member-color:#D4A800
}
body{background:var(--bg);color:var(--text);font-family:"Malgun Gothic","맑은 고딕",sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{display:none;max-width:600px;margin:auto;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
.page.active{display:block}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--border2);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:11px 4px 9px;color:var(--text3)}
.tab-btn.active{color:var(--blue)}
.tab-icon{font-size:22px}
.tab-label{font-size:11px;font-weight:600}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:17px}
.page-title{font-size:21px;font-weight:700}
.header-actions{display:flex;gap:5px}
.icon-btn{border:1px solid var(--border2);border-radius:9px;background:white;color:var(--text2);padding:7px 8px;font-size:11px}
.member-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:17px}
.member-tabs::-webkit-scrollbar{display:none}
.member-tab{flex-shrink:0;white-space:nowrap;border:1px solid var(--border2);border-radius:30px;background:white;color:var(--text2);font-size:12px;padding:7px 13px}
.member-tab.active{background:var(--member-color);border-color:var(--member-color);color:white}
.member-tab.add-member{border-style:dashed;color:var(--text3)}
.summary-card{background:linear-gradient(135deg,var(--member-color),color-mix(in srgb,var(--member-color) 70%,white));border-radius:16px;padding:22px 20px;color:white;margin-bottom:20px}
.sum-label{font-size:11px;opacity:.8;margin-bottom:5px}
.sum-amount{font-size:30px;font-weight:700;letter-spacing:-1px}
.sum-sub{font-size:12px;opacity:.8;margin-top:5px}
.sum-divider{border:0;border-top:1px solid #ffffff40;margin:15px 0}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.s-stat-val{font-size:14px;font-weight:700}
.s-stat-lbl{font-size:10px;opacity:.75;margin-top:3px}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-lbl{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.06em}
.btn-add{border:0;border-radius:9px;background:var(--text);color:white;padding:9px 15px;font-size:13px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:white;border:1px solid var(--border);border-radius:15px;overflow:hidden}
.card-header{display:flex;gap:10px;align-items:center;padding:13px;cursor:pointer}
.bank-icon{width:36px;height:36px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.card-header-info{flex:1;min-width:0}
.bank-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-product{font-size:11px;color:var(--text3);margin-top:3px}
.card-header-right{text-align:right;flex-shrink:0}
.rate-badge{display:inline-block;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:4px}
.card-header-paid{font-size:13px;font-weight:700}
.card-chevron{font-size:10px;color:var(--text3)}
.card-progress{padding:0 14px 12px}
.progress-meta{display:flex;justify-content:space-between;color:var(--text3);font-size:10px;margin-bottom:5px}
.progress-bar{height:4px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress-fill{height:100%;border-radius:3px}
.card-detail{display:none;border-top:1px solid var(--border)}
.card.open .card-detail{display:block}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 4px;padding:14px}
.info-lbl{font-size:10px;color:var(--text3);margin-bottom:4px}
.info-val{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 13px}
.btn-sm{border:1px solid var(--border2);border-radius:8px;background:white;color:var(--text);font-size:12px;padding:10px 2px}
.btn-sm.danger{color:var(--red)}
.drag-handle{color:var(--text3);cursor:grab;touch-action:none;user-select:none;padding:8px 4px}
.card.dragging,.budget-row.dragging{opacity:.4}
.card.drag-over,.budget-row.drag-over{border-top:3px solid var(--blue)}
.this-month-bar{background:var(--purple-bg);border-radius:10px;padding:13px;margin-bottom:18px}
.tmb-title{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:9px}
.tmb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;gap:8px}
.tmb-amount{font-weight:700;color:var(--purple)}
.tmb-total-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:9px;border-top:1px solid #5A20CC25;font-weight:700;color:var(--purple);font-size:13px}
.month-nav{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid var(--border);border-radius:11px;padding:9px 13px;margin-bottom:18px}
.month-nav-btn{border:0;background:none;font-size:23px;color:var(--text2);padding:2px 12px}
.month-nav-label{font-size:16px;font-weight:700}
.budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.bsum-card{border-radius:10px;padding:14px 10px}
.bsum-lbl{font-size:10px;font-weight:700;margin-bottom:6px}
.bsum-val{font-size:clamp(12px,3.8vw,18px);font-weight:700;letter-spacing:-.5px;overflow-wrap:anywhere}
.bsum-card.income{background:var(--green-bg);color:var(--green)}
.bsum-card.expense{background:var(--red-bg);color:var(--red)}
.bsum-card.saving{background:var(--purple-bg);color:var(--purple)}
.net-card{background:white;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.net-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.net-label{font-size:12px;color:var(--text2)}
.net-val{font-size:17px;font-weight:700}
.net-val.pos{color:var(--green)}
.net-val.neg{color:var(--red)}
.net-bar-bg{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.net-bar-fill{height:100%;background:var(--blue)}
.budget-section{margin-bottom:17px}
.budget-section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-weight:700}
.income-head{background:var(--green-bg);color:var(--green)}
.expense-head{background:var(--red-bg);color:var(--red)}
.saving-head{background:var(--purple-bg);color:var(--purple)}
.bsec-items{background:white;border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.budget-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:49px;position:relative}
.budget-row:last-of-type{border-bottom:0}
.budget-row .drag-handle{padding:12px 5px 12px 9px;font-size:14px}
.budget-check{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0;margin:0 6px}
.budget-row-label{font-size:13px;font-weight:500;flex:1;min-width:0;padding:11px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budget-row.completed .budget-row-label,.budget-row.completed .budget-amount{text-decoration:line-through;color:var(--text3)}
.budget-amount{width:104px;min-width:0;flex-shrink:0;text-align:right;border:0;background:none;font-size:13px;font-weight:700;padding:11px 4px;color:var(--text)}
.budget-amount:focus{outline:0;background:var(--blue-bg);border-radius:6px}
.del-row-btn{border:0;background:none;color:var(--text3);padding:11px 10px 11px 4px;font-size:19px}
.add-row-btn{width:100%;border:0;border-top:1px dashed var(--border2);background:white;color:var(--text3);padding:12px;font-size:12px}
.sub-cat-label{background:var(--surface2);padding:7px 12px;font-size:10px;font-weight:700;color:var(--text3)}
.saving-row{flex-wrap:wrap;padding-bottom:6px}
.saving-row .budget-row-label{flex:1}
.saving-row .budget-amount{width:86px}
.saving-row .del-row-btn{padding-right:8px}
.saving-controls{display:flex;align-items:center;gap:6px;padding:0 10px 3px 37px;width:100%}
.saving-date-control{display:flex;align-items:center;gap:4px;flex-shrink:0}
.saving-date-label{font-size:10px;color:var(--text3)}
.saving-date{width:57px;text-align:center;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;height:27px;font-size:11px;color:var(--text2);outline:none}
.saving-account-select{flex:1;min-width:0;max-width:100%;height:28px;border:1px solid var(--border2);background:white;color:var(--text2);border-radius:6px;font-size:11px;padding:0 4px}
.saving-linked-note{font-size:10px;color:var(--purple);margin-left:37px;padding-bottom:4px}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:300;justify-content:center;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:white;border-radius:20px 20px 0 0}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:5px;margin:12px auto 0}
.modal-inner{padding:16px 20px calc(24px + env(safe-area-inset-bottom))}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:9px;background:white;color:var(--text);font-size:16px;padding:11px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.modal-actions button{border:1px solid var(--border2);border-radius:9px;background:white;color:var(--text);font-size:14px;padding:13px}
.modal-actions button.primary{background:var(--blue);border-color:var(--blue);color:white}
.modal-actions button.danger-btn{background:var(--red);border-color:var(--red);color:white}
.field-help{font-size:11px;color:var(--text3);line-height:1.6;margin-top:5px}
.interest-options{display:flex;gap:8px}
.interest-opt{flex:1;display:flex;align-items:center;gap:6px;padding:11px 8px;border:1px solid var(--border2);border-radius:9px;font-size:12px;cursor:pointer}
.interest-opt input{width:auto}
.empty-state{text-align:center;color:var(--text3);font-size:13px;line-height:2;padding:35px 12px}
@media(min-width:600px){
 .modal-bg{align-items:center;padding:20px}
 .modal{width:430px;max-height:90vh;border-radius:16px}
 .modal-handle{display:none}
 .modal-inner{padding:24px}
}
@media(max-width:370px){
 .saving-controls{padding-left:30px;gap:4px}
 .saving-date{width:50px}
 .saving-row .budget-amount{width:78px}
 .budget-amount{width:91px}
}
</style>
</head>
<body>

<nav class="tab-bar">
<button class="tab-btn active" id="tab-savings" onclick="switchTab('savings')">
<span class="tab-icon">🏦</span><span class="tab-label">적금 관리</span>
</button>
<button class="tab-btn" id="tab-budget" onclick="switchTab('budget')">
<span class="tab-icon">📒</span><span class="tab-label">가계부</span>
</button>
</nav>

<section class="page active" id="page-savings">
 <div class="page-header">
  <div class="page-title">적금 관리</div>
  <div class="header-actions">
   <button class="icon-btn" onclick="openExportModal('savings')">📤 내보내기</button>
   <button class="icon-btn" onclick="openImportModal('savings')">📥 가져오기</button>
  </div>
 </div>
 <div class="member-tabs" id="savings-member-tabs"></div>

 <div class="summary-card">
  <div class="sum-label">전체 납입액</div>
  <div class="sum-amount" id="total-paid">₩0</div>
  <div class="sum-sub" id="total-maturity-sub">만기 예상 수령액: ₩0</div>
  <hr class="sum-divider">
  <div class="sum-stats">
   <div><div class="s-stat-val" id="stat-count">0</div><div class="s-stat-lbl">가입 계좌</div></div>
   <div><div class="s-stat-val" id="stat-avg-rate">—</div><div class="s-stat-lbl">평균 이율</div></div>
   <div><div class="s-stat-val" id="stat-interest">₩0</div><div class="s-stat-lbl">예상 이자</div></div>
  </div>
 </div>

 <div class="section-hdr">
  <span class="section-lbl">저축 목록</span>
  <button class="btn-add" onclick="openAddModal()">+ 추가</button>
 </div>
 <div class="this-month-bar" id="this-month-bar" style="display:none">
  <div class="tmb-title">📒 이번 달 가계부 저축</div>
  <div id="tmb-rows"></div>
 </div>
 <div class="cards" id="cards-list"></div>
</section>

<section class="page" id="page-budget">
 <div class="page-header">
  <div class="page-title">가계부</div>
  <div class="header-actions">
   <button class="icon-btn" onclick="openExportModal('budget')">📤 내보내기</button>
   <button class="icon-btn" onclick="openImportModal('budget')">📥 가져오기</button>
  </div>
 </div>
 <div class="member-tabs" id="budget-member-tabs"></div>
 <div class="month-nav">
  <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
  <span class="month-nav-label" id="month-label"></span>
  <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
 </div>

 <div class="budget-summary">
  <div class="bsum-card income"><div class="bsum-lbl">수입</div><div class="bsum-val" id="bsum-income">₩0</div></div>
  <div class="bsum-card expense"><div class="bsum-lbl">지출</div><div class="bsum-val" id="bsum-expense">₩0</div></div>
  <div class="bsum-card saving"><div class="bsum-lbl">저축</div><div class="bsum-val" id="bsum-saving">₩0</div></div>
 </div>

 <div class="net-card">
  <div class="net-row">
   <span class="net-label">잔액 (수입 − 지출 − 저축)</span>
   <span class="net-val" id="net-val">₩0</span>
  </div>
  <div class="net-bar-bg"><div class="net-bar-fill" id="net-bar"></div></div>
 </div>

 <div class="budget-section">
  <div class="budget-section-head income-head" onclick="toggleSection('income')">
   <span>💰 수입</span><span id="income-total">₩0</span>
  </div>
  <div class="bsec-items" id="income-items"></div>
 </div>

 <div class="budget-section">
  <div class="budget-section-head expense-head" onclick="toggleSection('expense')">
   <span>💳 지출</span><span id="expense-total">₩0</span>
  </div>
  <div class="bsec-items" id="expense-items"></div>
 </div>

 <div class="budget-section">
  <div class="budget-section-head saving-head" onclick="toggleSection('saving')">
   <span>💰 저축</span><span id="saving-total">₩0</span>
  </div>
  <div class="bsec-items" id="saving-items"></div>
 </div>
</section>

<!-- 적금 추가 / 수정 -->
<div class="modal-bg" id="add-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title" id="modal-title">새 적금 추가</div>
 <div class="field-row">
  <div class="field"><label>은행명</label><input id="f-bank" placeholder="국민은행"></div>
  <div class="field"><label>상품명</label><input id="f-name" placeholder="비상금 / 적금"></div>
 </div>
 <div class="field-row">
  <div class="field"><label>월 납입액 (선택)</label><input id="f-monthly" type="number" inputmode="numeric" placeholder="100000"></div>
  <div class="field"><label>연 이율 % (선택)</label><input id="f-rate" type="number" inputmode="decimal" step="0.01" placeholder="3.5"></div>
 </div>
 <div class="field">
  <label>이자 계산 방식</label>
  <div class="interest-options">
   <label class="interest-opt"><input type="radio" name="f-interest" value="simple" checked> 단리</label>
   <label class="interest-opt"><input type="radio" name="f-interest" value="compound"> 복리</label>
  </div>
 </div>
 <div class="field-row">
  <div class="field"><label>가입일</label><input id="f-start" placeholder="2026-01-01" inputmode="numeric"></div>
  <div class="field"><label>만기일 (선택)</label><input id="f-end" placeholder="2027-01-01" inputmode="numeric"></div>
 </div>
 <div class="field">
  <label>기본 납입액 / 직접 관리 금액 (원)</label>
  <input id="f-initbalance" type="number" inputmode="numeric" placeholder="현재 금액">
  <div class="field-help" id="f-balance-help">
   비상금처럼 금액이 바뀌는 계좌는 여기서 금액을 직접 수정할 수 있습니다.
  </div>
 </div>
 <div class="modal-actions">
  <button onclick="closeModal('add-modal')">취소</button>
  <button class="primary" onclick="saveAccount()">저장</button>
 </div>
</div></div></div>

<!-- 추가 납입 -->
<div class="modal-bg" id="extra-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title" id="extra-modal-title">추가 납입</div>
 <div class="field"><label>금액 (원)</label><input id="extra-amount" type="number" inputmode="numeric"></div>
 <div class="field"><label>메모 (선택)</label><input id="extra-memo"></div>
 <div class="modal-actions">
  <button onclick="closeModal('extra-modal')">취소</button>
  <button class="primary" onclick="saveExtra()">납입 확인</button>
 </div>
</div></div></div>

<!-- 항목 추가 -->
<div class="modal-bg" id="add-budget-row-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title" id="add-row-modal-title">항목 추가</div>
 <div class="field"><label>항목 이름</label><input id="br-name" placeholder="예: 교통비"></div>
 <div class="field"><label>금액 (원, 선택)</label><input id="br-amount" type="text" inputmode="numeric"></div>
 <div class="modal-actions">
  <button onclick="closeModal('add-budget-row-modal')">취소</button>
  <button class="primary" onclick="saveNewRow()">추가</button>
 </div>
</div></div></div>

<!-- 멤버 추가 / 수정 -->
<div class="modal-bg" id="member-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title" id="member-modal-title">멤버 추가</div>
 <div class="field"><label>이름</label><input id="member-name-input" placeholder="이름"></div>
 <div class="modal-actions">
  <button onclick="closeModal('member-modal')">취소</button>
  <button class="primary" onclick="saveMember()">저장</button>
 </div>
</div></div></div>

<!-- 멤버 관리 -->
<div class="modal-bg" id="member-options-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title" id="member-options-title">멤버 관리</div>
 <div class="modal-actions" style="grid-template-columns:repeat(3,1fr)">
  <button onclick="renameMember()">이름 변경</button>
  <button class="danger-btn" onclick="deleteMember()">삭제</button>
  <button onclick="closeModal('member-options-modal')">닫기</button>
 </div>
</div></div></div>

<!-- 삭제 확인 -->
<div class="modal-bg" id="confirm-modal">
<div class="modal"><div class="modal-handle"></div><div class="modal-inner">
 <div class="modal-title">삭제 확인</div>
 <p id="confirm-msg" style="font-size:14px;line-height:1.7;color:var(--text2)"></p>
 <div class="modal-actions">
  <button onclick="closeModal('confirm-modal')">취소</button>

<script>
"use strict";

/* =========================
   기본 유틸리티
========================= */

const $ = id => document.getElementById(id);
const fmt = n => '₩' + Math.round(Number(n)||0).toLocaleString('ko-KR');
const number = v => Number(v)||0;
const comma = n => number(n) ? number(n).toLocaleString('ko-KR') : '';
const fromComma = s => Number(String(s||'').replace(/[^0-9]/g,''))||0;

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function readJSON(key,fallback){
 try{
  const raw=localStorage.getItem(key);
  return raw===null ? fallback : JSON.parse(raw);
 }catch(e){
  return fallback;
 }
}

function writeJSON(key,data){
 try{
  localStorage.setItem(key,JSON.stringify(data));
  return true;
 }catch(e){
  alert('저장하지 못했습니다. 기기 저장 공간이나 브라우저 설정을 확인하세요.');
  return false;
 }
}

function dateKey(d){
 return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+
  String(d.getDate()).padStart(2,'0');
}

function validDate(s){
 const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(!m)return false;
 const d=new Date(+m[1],+m[2]-1,+m[3]);
 return dateKey(d)===s;
}

function parseFullDate(v){
 const s=String(v||'').trim();
 const digits=s.replace(/\D/g,'');
 const normalized=digits.length===8
  ? digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8)
  : s;
 return validDate(normalized)?normalized:null;
}

function parseSavingDate(input,y){
 const raw=String(input||'').trim();
 if(!raw)return '';
 const digits=raw.replace(/\D/g,'');
 let date='';
 if(/^\d{8}$/.test(digits)){
  date=digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8);
 }else if(/^\d{4}$/.test(digits)){
  date=y+'-'+digits.slice(0,2)+'-'+digits.slice(2,4);
 }else{
  const m=raw.match(/^(\d{1,2})[\/.-](\d{1,2})$/);
  if(m){
   date=y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  }else{
   const full=raw.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/);
   if(full){
    date=full[1]+'-'+full[2].padStart(2,'0')+'-'+full[3].padStart(2,'0');
   }
  }
 }
 return validDate(date)?date:null;
}

function shortDate(v){
 return validDate(v)?v.slice(5).replace('-','/'):'';
}

function monthCount(s,e){
 if(!validDate(s)||!validDate(e))return 0;
 const a=s.split('-').map(Number),b=e.split('-').map(Number);
 return Math.max(0,(b[0]-a[0])*12+b[1]-a[1]);
}

function closeModal(id){
 $(id).classList.remove('open');
}

function openModal(id){
 $(id).classList.add('open');
}

document.querySelectorAll('.modal-bg').forEach(el=>{
 el.addEventListener('click',e=>{
  if(e.target===el)closeModal(el.id);
 });
});

/* =========================
   멤버 관리
========================= */

const MEMBER_KEY='member_meta_v1';
const MEMBER_COLORS=[
 '#D4A800','#A83270','#1A7A40',
 '#1A5BA8','#5A20CC','#B04000'
];

let memberMeta=readJSON(MEMBER_KEY,{});

for(const type of ['savings','budget']){
 if(!memberMeta[type] || !Array.isArray(memberMeta[type].members)){
  memberMeta[type]={members:[],active:null};
 }
 if(!memberMeta[type].members.length){
  memberMeta[type].members=[{id:'me',name:'나'}];
 }
 if(!memberMeta[type].members.some(m=>m.id===memberMeta[type].active)){
  memberMeta[type].active=memberMeta[type].members[0].id;
 }
}

function saveMembers(){
 writeJSON(MEMBER_KEY,memberMeta);
}

function memberId(type){
 return memberMeta[type].active;
}

function memberName(type){
 return memberMeta[type].members.find(m=>m.id===memberId(type))?.name||'나';
}

function matchingMember(fromType,toType){
 const id=memberId(fromType);
 const name=memberName(fromType);
 return memberMeta[toType].members.find(m=>m.id===id && m.name===name)
  || memberMeta[toType].members.find(m=>m.name===name)
  || null;
}

function renderMemberTabs(type){
 const meta=memberMeta[type];
 const el=$(type+'-member-tabs');
 el.innerHTML=meta.members.map((m,i)=>{
  const active=m.id===meta.active;
  const style=active
   ? `style="background:${MEMBER_COLORS[i%6]};border-color:${MEMBER_COLORS[i%6]};color:white"`
   : '';
  return `<button class="member-tab ${active?'active':''}"
    ${style} data-member-id="${esc(m.id)}"
    title="길게 누르면 이름 변경 및 삭제"
   >${esc(m.name)}</button>`;
 }).join('')+
 `<button class="member-tab add-member" data-add-member>+ 멤버 추가</button>`;

 el.querySelectorAll('[data-member-id]').forEach(btn=>{
  const id=btn.dataset.memberId;
  let timer=null,longPressed=false;
  const start=()=>{
   longPressed=false;
   clearTimeout(timer);
   timer=setTimeout(()=>{
    longPressed=true;
    openMemberOptions(type,id);
   },650);
  };
  const cancel=()=>clearTimeout(timer);
  btn.addEventListener('pointerdown',start);
  btn.addEventListener('pointerup',cancel);
  btn.addEventListener('pointerleave',cancel);
  btn.addEventListener('pointercancel',cancel);
  btn.addEventListener('contextmenu',e=>{
   e.preventDefault();
   cancel();
   longPressed=true;
   openMemberOptions(type,id);
  });
  btn.addEventListener('click',()=>{
   if(!longPressed)switchMember(type,id);
   longPressed=false;
  });
 });
 el.querySelector('[data-add-member]').onclick=()=>openMemberModal(type);
}

function applyMemberColor(type){
 const index=memberMeta[type].members.findIndex(m=>m.id===memberId(type));
 document.documentElement.style.setProperty(
  '--member-color',MEMBER_COLORS[Math.max(0,index)%6]
 );
}

function switchMember(type,id){
 if(!memberMeta[type].members.some(m=>m.id===id))return;
 memberMeta[type].active=id;
 saveMembers();
 applyMemberColor(type);
 renderMemberTabs(type);
 if(type==='savings')renderSavings();
 else renderBudget();
}

let memberContext={type:'savings',id:null};

function openMemberModal(type,id=null){
 memberContext={type,id};
 $('member-modal-title').textContent=id?'이름 변경':'멤버 추가';
 $('member-name-input').value=id
  ? memberMeta[type].members.find(m=>m.id===id)?.name||''
  : '';
 openModal('member-modal');
}

function saveMember(){
 const name=$('member-name-input').value.trim();
 if(!name){alert('이름을 입력해주세요.');return;}
 const {type,id}=memberContext;
 if(id){
  const m=memberMeta[type].members.find(m=>m.id===id);
  if(m)m.name=name;
 }else{
  const newId='m'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  memberMeta[type].members.push({id:newId,name});
  memberMeta[type].active=newId;
 }
 saveMembers();
 closeModal('member-modal');
 renderMemberTabs(type);
 applyMemberColor(type);
 if(type==='savings')renderSavings();
 else renderBudget();
}

let memberOptionsContext={type:'savings',id:'me'};

function openMemberOptions(type,id){
 const m=memberMeta[type].members.find(m=>m.id===id);
 if(!m)return;
 memberOptionsContext={type,id};
 $('member-options-title').textContent=`"${m.name}" 관리`;
 openModal('member-options-modal');
}

function renameMember(){
 const {type,id}=memberOptionsContext;
 closeModal('member-options-modal');
 openMemberModal(type,id);
}

function confirmDelete(message,callback){
 $('confirm-msg').textContent=message;
 $('confirm-yes-btn').onclick=callback;
 openModal('confirm-modal');
}

function deleteMember(){
 const {type,id}=memberOptionsContext;
 const m=memberMeta[type].members.find(x=>x.id===id);
 if(!m)return;
 if(memberMeta[type].members.length===1){
  alert('마지막 멤버는 삭제할 수 없습니다.');
  return;
 }
 closeModal('member-options-modal');
 confirmDelete(`"${m.name}" 멤버와 해당 메뉴의 모든 데이터를 삭제할까요?`,()=>{
  localStorage.removeItem(type+'_'+id);
  if(type==='savings')localStorage.removeItem('links_'+id);
  delete stateCache[type+'_'+id];
  memberMeta[type].members=memberMeta[type].members.filter(x=>x.id!==id);
  if(memberMeta[type].active===id){
   memberMeta[type].active=memberMeta[type].members[0].id;
  }
  saveMembers();
  closeModal('confirm-modal');
  renderMemberTabs(type);
  applyMemberColor(type);
  if(type==='savings')renderSavings();
  else renderBudget();
 });
}

/* =========================
   저장 데이터
========================= */

const stateCache={};

function getSavingsDataById(id){
 const key='savings_'+id;
 if(!stateCache[key]){
  const d=readJSON(key,{});
  stateCache[key]={
   accounts:Array.isArray(d.accounts)?d.accounts:[],
   nextId:Number(d.nextId)||1
  };
 }
 return stateCache[key];
}

function getAccounts(){
 return getSavingsDataById(memberId('savings')).accounts;
}

function saveSavings(){
 writeJSON('savings_'+memberId('savings'),
  getSavingsDataById(memberId('savings')));
}

function getBudgetDataById(id){
 const key='budget_'+id;
 if(!stateCache[key]){
  const d=readJSON(key,{});
  stateCache[key]=d && typeof d==='object' && !Array.isArray(d)?d:{};
 }
 return stateCache[key];
}

function getBudgetData(){
 return getBudgetDataById(memberId('budget'));
}

function saveBudget(){
 writeJSON('budget_'+memberId('budget'),getBudgetData());
}

function monthKey(y,m){
 return y+'-'+String(m+1).padStart(2,'0');
}

function normalizeMonth(d){
 if(!Array.isArray(d.income))d.income=[];
 if(!d.expense || Array.isArray(d.expense))d.expense={fixed:[],flex:[]};
 if(!Array.isArray(d.expense.fixed))d.expense.fixed=[];
 if(!Array.isArray(d.expense.flex))d.expense.flex=[];
 if(!Array.isArray(d.saving))d.saving=[];
 return d;
}

function getMonthData(y,m){
 const all=getBudgetData();
 const key=monthKey(y,m);
 if(!all[key])all[key]={};
 return normalizeMonth(all[key]);
}

/* =========================
   현재 월 자동 이동
========================= */

let now=new Date();
let budgetYear=now.getFullYear();
let budgetMonth=now.getMonth();
let viewingMonthManually=false;
let activeTab='savings';
let lastCalendarMonth=monthKey(now.getFullYear(),now.getMonth());

function checkCalendarMonth(){
 const today=new Date();
 const key=monthKey(today.getFullYear(),today.getMonth());
 if(key!==lastCalendarMonth){
  lastCalendarMonth=key;
  if(!viewingMonthManually){
   budgetYear=today.getFullYear();
   budgetMonth=today.getMonth();
  }
  if(activeTab==='budget')renderBudget();
  else renderSavings();
 }
}

setInterval(checkCalendarMonth,60000);

document.addEventListener('visibilitychange',()=>{
 if(!document.hidden)checkCalendarMonth();
});

window.addEventListener('focus',checkCalendarMonth);

function changeMonth(direction){
 const d=new Date(budgetYear,budgetMonth+direction,1);
 budgetYear=d.getFullYear();
 budgetMonth=d.getMonth();
 const today=new Date();
 viewingMonthManually=
  budgetYear!==today.getFullYear()||
  budgetMonth!==today.getMonth();
 renderBudget();
}

function switchTab(tab){
 checkCalendarMonth();
 activeTab=tab;
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
 $('page-'+tab).classList.add('active');
 $('tab-'+tab).classList.add('active');
 applyMemberColor(tab);
 if(tab==='savings')renderSavings();
 else renderBudget();
}

/* =========================
   가계부 완료 저축 연동
========================= */

function resolveLinkedAccount(row,savingsId){
 const selected=row.linkedAccountId;
 if(selected!==undefined && selected!==null){
  return selected===''?null:selected;
 }

 // 기존 자동연결 정보 호환
 if(row.autoSavingsAccountId!==undefined &&
    row.autoSavingsAccountId!==null){
  return row.autoSavingsAccountId;
 }

 // 기존 links_ 데이터 호환
 const legacy=readJSON('links_'+savingsId,{});
 return legacy[row.name]??null;
}

function getCompletedSavingAmount(acc,savingsMemberId){
 const member=memberMeta.savings.members.find(m=>m.id===savingsMemberId);
 if(!member)return 0;

 const budgetMember=memberMeta.budget.members.find(m=>
  m.id===member.id && m.name===member.name
 )||memberMeta.budget.members.find(m=>m.name===member.name);

 if(!budgetMember)return 0;

 const all=getBudgetDataById(budgetMember.id);
 let total=0;

 Object.values(all).forEach(month=>{
  if(!month || !Array.isArray(month.saving))return;
  month.saving.forEach(row=>{
   // 완료 확인이 가장 중요한 조건입니다.
   if(row.completed!==true)return;

   const linkedId=resolveLinkedAccount(row,member.id);
   if(linkedId===null || linkedId===undefined || linkedId==='')return;
   if(String(linkedId)!==String(acc.id))return;

   // 날짜는 기록용이며 잔액 반영 조건으로 사용하지 않습니다.
   total+=Math.max(0,number(row.amount));
  });
 });

 return total;
}

function calcPaid(acc){
 return number(acc.initBalance)+number(acc.extra)+
  getCompletedSavingAmount(acc,memberId('savings'));
}

function calcMaturity(acc){
 const paid=calcPaid(acc);
 if(!validDate(acc.start)||!validDate(acc.end))return paid;

 const total=monthCount(acc.start,acc.end);
 const today=dateKey(new Date());
 const elapsed=Math.min(total,monthCount(acc.start,today));
 const remaining=Math.max(0,total-elapsed);
 const monthly=number(acc.monthly);
 const r=number(acc.rate)/1200;

 if(!r)return paid+monthly*remaining;

 if(acc.interestType==='compound'){
  return Math.round(
   paid*Math.pow(1+r,remaining)+
   (remaining>0?monthly*(Math.pow(1+r,remaining)-1)/r:0)
  );
 }

 return Math.round(
  paid+monthly*remaining+
  paid*r*remaining+
  monthly*r*remaining*(remaining+1)/2
 );
}

/* =========================
   적금 관리
========================= */

const BANK_COLORS={
 '국민':['#FFF0DC','#A85A00','#F28C28'],
 'KB':['#FFF0DC','#A85A00','#F28C28'],
 '카카오':['#FFF7CC','#806500','#FFD43B'],
 '신한':['#E3EEFF','#1455A0','#3478C9'],
 '우리':['#E0F3E8','#176B45','#3AA76D'],
 '하나':['#D6F0E4','#005C3A','#009B6D'],
 '농협':['#E2F4D4','#3A6B00','#5A9E00'],
 '기업':['#CFE4FF','#003F9B','#1358C8'],
 '토스':['#E0EEFF','#1353C8','#3370E8'],
 '현금':['#F3EFE4','#6B5938','#A98B55']
};

const FALLBACK_COLORS=[
 ['#EDE0FF','#5A20CC','#7840E8'],
 ['#FFE0F0','#8C1060','#CC2080'],
 ['#E0FFF4','#006648','#00996A'],
 ['#FFF0E0','#8C4800','#CC7000']
];

function bankColor(bank,i){
 const key=Object.keys(BANK_COLORS).find(k=>String(bank||'').includes(k));
 return key?BANK_COLORS[key]:FALLBACK_COLORS[i%FALLBACK_COLORS.length];
}

function renderSavings(){
 const accs=getAccounts();
 const paidAll=accs.reduce((s,a)=>s+calcPaid(a),0);
 const maturity=accs.reduce((s,a)=>s+calcMaturity(a),0);

 // 기존 앱에서 기본 멤버의 주택청약은 상단 전체 납입액에서 제외
 const displayPaid=memberId('savings')==='me'
  ? accs.filter(a=>!String(a.name||'').includes('주택청약'))
    .reduce((s,a)=>s+calcPaid(a),0)
  : paidAll;

 $('total-paid').textContent=fmt(displayPaid);
 $('total-maturity-sub').textContent='만기 예상 수령액: '+fmt(maturity);
 $('stat-count').textContent=accs.length;
 $('stat-avg-rate').textContent=accs.length
  ? (accs.reduce((s,a)=>s+number(a.rate),0)/accs.length).toFixed(2)+'%'
  : '—';
 $('stat-interest').textContent=fmt(Math.max(0,maturity-paidAll));

 renderThisMonthBar();

 const el=$('cards-list');
 if(!accs.length){
  el.innerHTML='<div class="empty-state">🏦<br>등록된 저축 내용이 없습니다.<br>+ 추가 버튼으로 시작하세요.</div>';
  return;
 }

 el.innerHTML=accs.map((acc,i)=>{
  const c=bankColor(acc.bank,i);
  const paid=calcPaid(acc);
  const linked=getCompletedSavingAmount(acc,memberId('savings'));
  const mat=calcMaturity(acc);
  const total=monthCount(acc.start,acc.end);
  const elapsed=monthCount(acc.start,dateKey(new Date()));
  const progress=total
   ? Math.min(100,Math.round(Math.min(total,elapsed)/total*100))
   : 0;

  return `
  <div class="card" data-account-id="${esc(acc.id)}">
   <div class="card-header" data-toggle-account="${esc(acc.id)}">
    <span class="drag-handle" data-account-drag>≡</span>
    <div class="bank-icon" style="background:${c[0]};color:${c[1]}">
     ${esc(String(acc.bank||'').slice(0,2))}
    </div>
    <div class="card-header-info">
     <div class="bank-name">${esc(acc.name)}</div>
     <div class="bank-product">
      ${esc(acc.bank)}
      ${linked>0?` · 📒 ${fmt(linked)}`:''}
      ${acc.interestType==='compound'?' · 복리':''}
     </div>
    </div>
    <div class="card-header-right">
     ${number(acc.rate)>0?`<div class="rate-badge" style="background:${c[0]};color:${c[1]}">${number(acc.rate).toFixed(2)}%</div>`:''}
     <div class="card-header-paid" style="color:${c[1]}">${fmt(paid)}</div>
    </div>
    <span class="card-chevron">▼</span>
   </div>
   <div class="card-progress">
    <div class="progress-meta">
     <span>납입 현황 · ${Math.max(0,elapsed)}개월째</span>
     <span>${total?progress+'%':'만기 없음'}</span>
    </div>
    <div class="progress-bar">
     <div class="progress-fill" style="width:${progress}%;background:${c[2]}"></div>
    </div>
   </div>
   <div class="card-detail">
    <div class="card-grid">
     <div><div class="info-lbl">월 납입액</div><div class="info-val">${acc.monthly?fmt(acc.monthly):'자유납입'}</div></div>
     <div><div class="info-lbl">현재 납입액</div><div class="info-val">${fmt(paid)}</div></div>
     <div><div class="info-lbl">${acc.end?'만기 예상액':'현재 잔액'}</div><div class="info-val">${fmt(mat)}</div></div>
     <div><div class="info-lbl">기본 납입액</div><div class="info-val">${fmt(acc.initBalance)}</div></div>
     <div><div class="info-lbl">가계부 완료 반영</div><div class="info-val">${fmt(linked)}</div></div>
     <div><div class="info-lbl">추가 납입</div><div class="info-val">${fmt(acc.extra)}</div></div>
     <div><div class="info-lbl">만기일</div><div class="info-val">${acc.end?esc(acc.end):'만기 없음'}</div></div>
    </div>
    <div class="card-actions">
     <button class="btn-sm" data-extra-account="${esc(acc.id)}">+ 추가납입</button>
     <button class="btn-sm" data-edit-account="${esc(acc.id)}">수정</button>
     <button class="btn-sm danger" data-delete-account="${esc(acc.id)}">삭제</button>
    </div>
   </div>
  </div>`;
 }).join('');

 el.querySelectorAll('[data-toggle-account]').forEach(header=>{
  header.addEventListener('click',e=>{

function saveAccount(){
 const bank=$('f-bank').value.trim();
 const name=$('f-name').value.trim();
 const monthly=number($('f-monthly').value);
 const rate=number($('f-rate').value);
 const start=parseFullDate($('f-start').value);
 const endRaw=$('f-end').value.trim();
 const end=endRaw?parseFullDate(endRaw):null;
 const initBalance=number($('f-initbalance').value);
 const interestType=document.querySelector('input[name="f-interest"]:checked')?.value||'simple';

 if(!bank||!name||!start){
  alert('은행명, 상품명, 올바른 가입일을 입력해주세요.');
  return;
 }
 if(endRaw&&!end){
  alert('만기일을 확인해주세요.');
  return;
 }
 if(end && end<start){
  alert('만기일은 가입일보다 빠를 수 없습니다.');
  return;
 }
 if(monthly<0||rate<0||initBalance<0){
  alert('금액과 이율은 0 이상으로 입력해주세요.');
  return;
 }

 const data=getSavingsDataById(memberId('savings'));
 if(editingId!==null){
  const index=data.accounts.findIndex(a=>String(a.id)===String(editingId));
  if(index<0)return;
  data.accounts[index]={
   ...data.accounts[index],
   bank,name,monthly,rate,start,end,interestType,initBalance
  };
 }else{
  const used=data.accounts.map(a=>Number(a.id)).filter(Number.isFinite);
  const id=Math.max(data.nextId-1,0,...used)+1;
  data.accounts.push({
   id,bank,name,monthly,rate,start,end,interestType,
   initBalance,extra:0,autoday:null,registeredAt:dateKey(new Date())
  });
  data.nextId=id+1;
 }

 saveSavings();
 closeModal('add-modal');
 renderSavings();
}

function deleteAcc(id){

 if(!acc)return;
 confirmDelete(`${acc.bank} ${acc.name} 계좌를 삭제할까요?`,()=>{

  const key='links_'+memberId('savings');
  const links=readJSON(key,{});
  Object.keys(links).forEach(n=>{
   if(String(links[n])===String(id))delete links[n];
  });
  writeJSON(key,links);

  // 가계부의 직접 연결 정보 정리
  const bm=matchingMember('savings','budget');
  if(bm){
   const budgets=getBudgetDataById(bm.id);
   Object.values(budgets).forEach(month=>{
    if(!Array.isArray(month?.saving))return;
    month.saving.forEach(row=>{
     if(String(row.linkedAccountId)===String(id)){
      row.linkedAccountId=null;
     }
    });
   });
   writeJSON('budget_'+bm.id,budgets);
  }

  closeModal('confirm-modal');
  renderSavings();
 });
}

function sumArr(arr){
 return (arr||[]).reduce((sum,row)=>sum+number(row.amount),0);
}

function budgetTotals(d){
 const income=sumArr(d.income);
 const expense=sumArr(d.expense.fixed)+sumArr(d.expense.flex);
 const saving=sumArr(d.saving);
 return {income,expense,saving,net:income-expense-saving};
}

function renderBudgetTotals(d){
 const t=budgetTotals(d);
 $('bsum-income').textContent=fmt(t.income);
 $('bsum-expense').textContent=fmt(t.expense);
 $('bsum-saving').textContent=fmt(t.saving);
 $('income-total').textContent=fmt(t.income);
 $('expense-total').textContent=fmt(t.expense);
 $('saving-total').textContent=fmt(t.saving);
 $('net-val').textContent=fmt(t.net);
 $('net-val').className='net-val '+(t.net>=0?'pos':'neg');
 $('net-bar').style.width=(t.income>0
  ?Math.max(0,Math.min(100,(t.income-t.net)/t.income*100))
  :0)+'%';
}

function wireBudgetGrid(grid,sec,sub){
 grid.querySelectorAll('.budget-row').forEach((rowEl)=>{
  const index=Number(rowEl.dataset.rowIndex);

  const amountEl=rowEl.querySelector('[data-amount]');
  amountEl.addEventListener('focus',()=>amountEl.select());
  amountEl.addEventListener('input',()=>{
   const raw=fromComma(amountEl.value);
   amountEl.value=raw?comma(raw):'';
   const row=getRowArray(sec,sub)[index];
   if(!row)return;
   row.amount=raw;
   if(row.autoSavingsAccountId!=null)row.manualOverride=true;
   saveBudget();
   renderBudgetTotals(getMonthData(budgetYear,budgetMonth));
  });

  const check=rowEl.querySelector('[data-completed]');
  if(check){
   check.addEventListener('change',()=>{
    const row=getRowArray(sec,sub)[index];
    if(!row)return;
    row.completed=check.checked;
    saveBudget();
    rowEl.classList.toggle('completed',check.checked);
    if(sec==='saving'){
     // 수동 완료 체크가 적금관리 금액 반영 기준
     renderBudget();
    }
   });
  }

  const dateEl=rowEl.querySelector('[data-deposit-date]');
  if(dateEl){
   // 1101 → 11/01
   dateEl.addEventListener('input',()=>{
    let v=dateEl.value.replace(/\D/g,'').slice(0,8);
    if(v.length===4){
     v=v.slice(0,2)+'/'+v.slice(2,4);
    }
    dateEl.value=v;
   });

   const commitDate=()=>{
    const item=getRowArray('saving','')[index];
    if(!item)return;

    const raw=dateEl.value.trim();
    const result=parseSavingDate(raw,budgetYear);
    if(result===null){
     alert('날짜를 확인해주세요. 예: 1101 또는 11/01');
     dateEl.value=shortDate(item.depositDate);
     return;
    }

    item.depositDate=result;
    saveBudget();
    dateEl.value=shortDate(result);
   };

   dateEl.addEventListener('blur',commitDate);
   dateEl.addEventListener('keydown',e=>{
    if(e.key==='Enter')dateEl.blur();
   });
  }

  const linkedEl=rowEl.querySelector('[data-linked-account]');
  if(linkedEl){
   linkedEl.addEventListener('change',()=>{
    const item=getRowArray('saving','')[index];
    if(!item)return;
    item.linkedAccountId=linkedEl.value===''?null:Number(linkedEl.value);
    saveBudget();
   });
  }

  rowEl.querySelector('[data-delete-row]').onclick=()=>{
   deleteRow(sec,index,sub);
  };
 });

 initReorder(grid,'.budget-row','[data-row-drag]',(from,to)=>{
  const arr=getRowArray(sec,sub);
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  saveBudget();
  renderBudget();
 });
}

/* =========================
   드래그 순서 변경
========================= */

function initReorder(container,rowSelector,handleSelector,onMove){
 if(!container)return;

 container.querySelectorAll(handleSelector).forEach(handle=>{
  handle.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   e.preventDefault();
   e.stopPropagation();

   const dragged=handle.closest(rowSelector);
   if(!dragged)return;

   const getRows=()=>[...container.querySelectorAll(rowSelector)];
   const from=getRows().indexOf(dragged);
   const rect=dragged.getBoundingClientRect();
   const startY=e.clientY;
   let target=null;

   const ghost=dragged.cloneNode(true);
   ghost.style.cssText=`
    position:fixed;
    left:${rect.left}px;
    top:${rect.top}px;
    width:${rect.width}px;
    opacity:.85;
    pointer-events:none;
    z-index:999;
    background:white;
    box-shadow:0 8px 24px #0003;
   `;
   document.body.appendChild(ghost);
   dragged.classList.add('dragging');

   function move(ev){
    if(ev.cancelable)ev.preventDefault();
    ghost.style.top=(rect.top+ev.clientY-startY)+'px';

    const rows=getRows().filter(r=>r!==dragged);
    const found=rows.find(r=>{
     const box=r.getBoundingClientRect();
     return ev.clientY>=box.top&&ev.clientY<=box.bottom;
    })||null;

    if(target!==found){
     if(target)target.classList.remove('drag-over');
     target=found;
     if(target)target.classList.add('drag-over');
    }
   }

   function end(){
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    ghost.remove();
    dragged.classList.remove('dragging');

    if(target){
     target.classList.remove('drag-over');
     const to=getRows().indexOf(target);
     if(from!==to&&from>=0&&to>=0)onMove(from,to);
    }
   }

   document.addEventListener('pointermove',move,{passive:false});
   document.addEventListener('pointerup',end,{once:true});
   document.addEventListener('pointercancel',end,{once:true});
  });
 });
}

function doImport(){
 let parsed;
 try{
  parsed=JSON.parse($('import-data').value);
 }catch(e){
  alert('JSON 데이터 형식을 확인해주세요.');
  return;
 }

 const type=ioContext;
 if(!parsed || parsed.type!==type){
  alert('가져올 데이터 종류가 다릅니다.');
  return;
 }

 if(type==='savings'&&!Array.isArray(parsed.accounts)){
  alert('올바른 적금 데이터가 아닙니다.');
  return;
 }

 if(type==='budget'&&
    (!parsed.data||typeof parsed.data!=='object'||Array.isArray(parsed.data))){
  alert('올바른 가계부 데이터가 아닙니다.');
  return;
 }

 const target=$('import-target-member').value;
 const existing=target==='__new__'
  ?null
  :memberMeta[type].members.find(m=>m.id===target);

 if(existing){
  if(!confirm(`"${existing.name}"의 기존 ${type==='savings'?'적금':'가계부'} 데이터를 덮어쓸까요?`))return;
 }

 let id=target;
 if(target==='__new__'){
  id='m'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
 }

 if(type==='savings'){
  const records={
   accounts:parsed.accounts,
   nextId:Number(parsed.nextId)||1
  };
  if(!writeJSON('savings_'+id,records))return;
  writeJSON('links_'+id,parsed.links||{});
  delete stateCache['savings_'+id];
 }else{
  // 기존 완료 상태, 납입일, 계좌 연결 정보를 보존
  if(!writeJSON('budget_'+id,parsed.data))return;
  delete stateCache['budget_'+id];
 }

 if(target==='__new__'){
  memberMeta[type].members.push({
   id,
   name:String(parsed.member||'가져온 멤버')
  });
 }

 memberMeta[type].active=id;
 saveMembers();
 closeModal('import-modal');
 renderMemberTabs(type);
 applyMemberColor(type);

 if(type==='savings')renderSavings();
 else renderBudget();

 alert('가져오기가 완료되었습니다.');
}

// 모바일에서 탭 좌우 스와이프
(function(){
 let sx=0,sy=0;

 document.addEventListener('touchstart',e=>{
  if(document.querySelector('.modal-bg.open'))return;
  if(e.target.closest('.drag-handle,.member-tabs,input,select,textarea'))return;
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
 },{passive:true});

 document.addEventListener('touchend',e=>{
  if(!sx)return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  sx=0;
  if(Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.5)return;
  if(dx<0&&activeTab==='savings')switchTab('budget');
  if(dx>0&&activeTab==='budget')switchTab('savings');
 },{passive:true});
})();

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
