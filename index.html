
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재정관리">
<meta name="theme-color" content="#F0F2F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>재정관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#F0F2F8;--surface:#FFF;--surface2:#E8EBF4;
 --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
 --text:#1A1A2E;--text2:#5A5A7A;--text3:#9090AA;
 --green:#1A7A40;--green-bg:#E0F5EB;
 --blue:#1A5BA8;--blue-bg:#E4EEF8;
 --red:#B02020;--red-bg:#FDEAEA;
 --purple:#5A20CC;--purple-bg:#F0EAFF;
 --member-color:#D4A800
}
html{-webkit-text-size-adjust:100%}
body{
 font-family:"Malgun Gothic","맑은 고딕",sans-serif;
 background:var(--bg);color:var(--text);
 min-height:100vh;-webkit-font-smoothing:antialiased
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.page{
 display:none;max-width:600px;margin:0 auto;
 padding:max(16px,env(safe-area-inset-top)) 16px
 calc(85px + env(safe-area-inset-bottom))
}
.page.active{display:block}
.tab-bar{
 position:fixed;bottom:0;left:0;right:0;
 display:flex;background:var(--surface);
 border-top:1px solid var(--border2);
 padding-bottom:env(safe-area-inset-bottom);z-index:100
}
.tab-btn{
 flex:1;display:flex;flex-direction:column;
 align-items:center;gap:3px;border:0;
 background:transparent;padding:10px 4px 8px;
 color:var(--text3)
}
.tab-btn.active{color:var(--blue)}
.tab-icon{font-size:22px}
.tab-label{font-size:10px;font-weight:600}
.page-header{
 display:flex;align-items:center;
 justify-content:space-between;gap:8px;margin-bottom:16px
}
.page-title{font-size:20px;font-weight:700}
.header-actions{display:flex;gap:6px}
.icon-btn{
 background:white;border:1px solid var(--border2);
 border-radius:9px;padding:7px 9px;
 font-size:11px;color:var(--text2)
}
.member-tabs{
 display:flex;gap:6px;overflow-x:auto;
 scrollbar-width:none;margin-bottom:16px
}
.member-tabs::-webkit-scrollbar{display:none}
.member-tab{
 flex-shrink:0;padding:7px 13px;border-radius:99px;
 border:1.5px solid var(--border2);background:white;
 font-size:12px;font-weight:500;color:var(--text2);
 white-space:nowrap
}
.member-tab.active{
 background:var(--member-color);
 border-color:var(--member-color);color:white
}
.member-tab.add-member{
 border-style:dashed;color:var(--text3)
}
.summary-card{
 background:linear-gradient(
 135deg,var(--member-color),
 color-mix(in srgb,var(--member-color) 70%,white));
 border-radius:16px;padding:22px 20px 20px;
 margin-bottom:20px;color:white
}
.sum-label{font-size:11px;opacity:.75;margin-bottom:5px}
.sum-amount{font-size:30px;font-weight:700;letter-spacing:-1px}
.sum-sub{font-size:12px;opacity:.7;margin-top:5px}
.sum-divider{
 border:0;border-top:1px solid rgba(255,255,255,.2);
 margin:14px 0
}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.s-stat-val{font-size:14px;font-weight:700}
.s-stat-lbl{font-size:10px;opacity:.75;margin-top:3px}
.section-hdr{
 display:flex;align-items:center;
 justify-content:space-between;margin-bottom:12px
}
.section-lbl{
 font-size:11px;font-weight:700;
 color:var(--text3);letter-spacing:.07em
}
.btn-add{
 background:var(--text);color:white;border:0;
 border-radius:9px;padding:9px 15px;font-size:13px
}
.cards{display:flex;flex-direction:column;gap:8px}
.card{
 background:white;border:1px solid var(--border);
 border-radius:16px;overflow:hidden
}
.card-header{
 display:flex;align-items:center;gap:10px;
 padding:13px 14px;cursor:pointer
}
.bank-icon{
 width:35px;height:35px;border-radius:9px;
 flex-shrink:0;display:flex;align-items:center;
 justify-content:center;font-size:12px;font-weight:700
}
.card-header-info{flex:1;min-width:0}
.bank-name{
 font-size:14px;font-weight:700;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.bank-product{font-size:11px;color:var(--text3);margin-top:3px}
.card-header-right{text-align:right;flex-shrink:0}
.rate-badge{
 display:inline-block;padding:3px 8px;
 border-radius:99px;font-size:10px;
 font-weight:700;margin-bottom:4px
}
.card-header-paid{font-size:13px;font-weight:700}
.card-chevron{font-size:10px;color:var(--text3)}
.card-progress{padding:0 14px 11px}
.progress-meta{
 display:flex;justify-content:space-between;
 font-size:10px;color:var(--text3);margin-bottom:5px
}
.progress-bar{
 height:4px;border-radius:3px;
 background:var(--surface2);overflow:hidden
}
.progress-fill{height:100%;border-radius:3px}
.card-detail{display:none;border-top:1px solid var(--border)}
.card.open .card-detail{display:block}
.card-grid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:13px 5px;padding:14px
}
.info-lbl{font-size:10px;color:var(--text3);margin-bottom:4px}
.info-val{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.card-actions{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:6px;padding:0 14px 13px
}
.btn-sm{
 font-size:12px;border:1px solid var(--border2);
 border-radius:8px;background:white;color:var(--text);
 padding:9px 4px;min-height:35px
}
.btn-sm.danger{color:var(--red)}
.drag-handle{
 color:var(--text3);font-size:16px;
 cursor:grab;flex-shrink:0;padding:8px 4px;
 touch-action:none;user-select:none
}
.dragging{opacity:.4}
.drag-over{border-top:3px solid var(--blue)!important}
.this-month-bar{
 background:var(--purple-bg);border-radius:11px;
 padding:12px 14px;margin-bottom:18px
}
.tmb-title{
 font-size:11px;font-weight:700;
 color:var(--purple);margin-bottom:9px
}
.tmb-row{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;padding:5px 0;font-size:12px
}
.tmb-amount{color:var(--purple);font-weight:700;white-space:nowrap}
.tmb-total-row{
 display:flex;justify-content:space-between;
 padding-top:9px;margin-top:7px;
 border-top:1px solid rgba(90,32,204,.15);
 font-size:13px;font-weight:700;color:var(--purple)
}
.link-badge{
 display:inline-block;margin-left:4px;
 border-radius:99px;background:var(--purple-bg);
 color:var(--purple);font-size:10px;
 font-weight:600;padding:2px 6px
}
.month-nav{
 display:flex;align-items:center;justify-content:space-between;
 background:white;border:1px solid var(--border);
 border-radius:11px;padding:10px 15px;margin-bottom:20px
}
.month-nav-btn{
 border:0;background:none;
 font-size:23px;padding:2px 10px;color:var(--text2)
}
.month-nav-label{font-size:16px;font-weight:700}
.budget-summary{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-bottom:17px
}
.bsum-card{border-radius:10px;padding:14px 11px;min-width:0}
.bsum-lbl{font-size:10px;font-weight:700;margin-bottom:6px}
.bsum-val{
 font-size:clamp(12px,4vw,18px);
 font-weight:700;letter-spacing:-.5px;overflow-wrap:anywhere
}
.bsum-card.income{background:var(--green-bg);color:var(--green)}
.bsum-card.expense{background:var(--red-bg);color:var(--red)}
.bsum-card.saving{background:var(--purple-bg);color:var(--purple)}
.net-card{
 background:white;border:1px solid var(--border);
 border-radius:11px;padding:15px;margin-bottom:20px
}
.net-row{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px;margin-bottom:10px
}
.net-label{font-size:12px;color:var(--text2)}
.net-val{font-size:18px;font-weight:700}
.net-val.pos{color:var(--green)}
.net-val.neg{color:var(--red)}
.net-bar-bg{
 background:var(--surface2);height:6px;
 border-radius:4px;overflow:hidden
}
.net-bar-fill{height:100%;background:var(--blue)}
.budget-section{margin-bottom:18px}
.budget-section-head{
 display:flex;align-items:center;justify-content:space-between;
 padding:11px 14px;border-radius:10px 10px 0 0;
 cursor:pointer;font-size:13px;font-weight:700
}
.income-head{background:var(--green-bg);color:var(--green)}
.expense-head{background:var(--red-bg);color:var(--red)}
.saving-head{background:var(--purple-bg);color:var(--purple)}
.bsec-items{
 background:white;border:1px solid var(--border);
 border-top:0;border-radius:0 0 10px 10px;overflow:hidden
}
.sub-cat-label{
 padding:7px 12px;background:var(--surface2);
 font-size:10px;color:var(--text3);font-weight:700
}
.budget-row{
 display:flex;align-items:center;min-height:49px;
 border-bottom:1px solid var(--border)
}
.budget-row .drag-handle{padding:12px 5px 12px 9px;font-size:14px}
.budget-check{
 width:18px;height:18px;flex-shrink:0;
 accent-color:var(--blue);margin:0 5px;cursor:pointer
}
.budget-row-label{
 flex:1;min-width:0;font-size:13px;
 font-weight:500;padding:10px 2px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.budget-row.completed .budget-row-label,
.budget-row.completed .budget-amount{
 text-decoration:line-through;color:var(--text3)
}
.budget-amount{
 width:103px;flex-shrink:0;padding:11px 3px;
 border:0;outline:0;background:none;
 font-size:13px;font-weight:700;text-align:right;color:var(--text)
}
.budget-amount:focus{
 background:var(--blue-bg);border-radius:6px;color:var(--blue)
}
.del-row-btn{
 border:0;background:none;color:var(--text3);
 padding:11px 10px 11px 3px;font-size:19px
}
.add-row-btn{
 width:100%;border:0;border-top:1px dashed var(--border2);
 background:white;color:var(--text3);
 padding:12px;font-size:12px
}
/* 저축 항목명 바로 옆 납입일 */
.saving-row .budget-row-label{
 display:flex;align-items:center;gap:5px;
 overflow:visible;white-space:normal;padding-right:0
}
.saving-name{
 min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap
}
.saving-date-control{
 display:inline-flex;align-items:center;flex-shrink:0;
 height:24px;padding:0 2px;background:white;
 border:1px solid var(--border2);border-radius:5px
}
.saving-date{
 width:44px;height:20px;border:0;
 outline:0;background:transparent;
 font-size:10px;color:var(--text2);
 text-align:center;font-variant-numeric:tabular-nums
}
.saving-date-control:focus-within{border-color:var(--blue)}
.saving-row .budget-amount{width:89px;padding-left:0}
.modal-bg{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.45);z-index:300;
 align-items:flex-end;justify-content:center
}
.modal-bg.open{display:flex}
.modal{
 width:100%;max-width:600px;max-height:92vh;
 overflow-y:auto;background:white;
 border-radius:20px 20px 0 0
}
.modal-handle{
 width:36px;height:4px;border-radius:4px;
 background:var(--border2);margin:12px auto 0
}
.modal-inner{
 padding:17px 20px calc(24px + env(safe-area-inset-bottom))
}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{
 display:block;font-size:11px;
 color:var(--text2);margin-bottom:6px
}
.field input,.field select,.field textarea{
 width:100%;font-size:16px;padding:11px 12px;
 border:1px solid var(--border2);border-radius:9px;
 background:white;color:var(--text);outline:0
}
.field input:focus,.field select:focus,
.field textarea:focus{border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-help{
 font-size:11px;color:var(--text3);
 line-height:1.6;margin-top:5px
}
.interest-options{display:flex;gap:8px}
.interest-opt{
 flex:1;display:flex;align-items:center;gap:7px;
 border:1px solid var(--border2);border-radius:9px;
 padding:11px;font-size:12px;cursor:pointer
}
.interest-opt input{width:auto}
.modal-actions{
 display:grid;grid-template-columns:1fr 1fr;
 gap:8px;margin-top:18px
}
.modal-actions button{
 border:1px solid var(--border2);border-radius:9px;
 background:white;color:var(--text);
 padding:13px;font-size:14px;min-height:47px
}
.modal-actions button.primary{
 background:var(--blue);border-color:var(--blue);color:white
}
.modal-actions button.danger-btn{
 background:var(--red);border-color:var(--red);color:white
}
.empty-state{
 text-align:center;padding:40px 15px;
 color:var(--text3);font-size:13px;line-height:2.2
}
@media(max-width:390px){
 .saving-row .budget-amount{width:78px;font-size:12px}
 .saving-date{width:40px}
 .budget-row-label{font-size:12px}
 .drag-handle{padding:5px}
}
@media(min-width:600px){
 .modal-bg{align-items:center;padding:20px}
 .modal{width:440px;border-radius:16px;max-height:90vh}
 .modal-handle{display:none}
 .modal-inner{padding:24px}
}
</style>
</head>
<body>

<nav class="tab-bar">
 <button class="tab-btn active" id="tab-savings" onclick="switchTab('savings')">
  <span class="tab-icon">🏦</span>
  <span class="tab-label">적금 관리</span>
 </button>
 <button class="tab-btn" id="tab-budget" onclick="switchTab('budget')">
  <span class="tab-icon">📒</span>
  <span class="tab-label">가계부</span>
 </button>
</nav>

<section class="page active" id="page-savings">
 <div class="page-header">
  <div class="page-title">적금 관리</div>
  <div class="header-actions">
   <button class="icon-btn" onclick="openExportModal('savings')">📤 내보내기</button>
   <button class="icon-btn" onclick="openImportModal('savings')">📥 가져오기</button>
  </div>
 </div>
 <div class="member-tabs" id="savings-member-tabs"></div>
 <div class="summary-card">
  <div class="sum-label">전체 납입액</div>
  <div class="sum-amount" id="total-paid">₩0</div>
  <div class="sum-sub" id="total-maturity-sub">만기 예상 수령액: ₩0</div>
  <hr class="sum-divider">
  <div class="sum-stats">
   <div><div class="s-stat-val" id="stat-count">0</div><div class="s-stat-lbl">가입 계좌</div></div>
   <div><div class="s-stat-val" id="stat-avg-rate">—</div><div class="s-stat-lbl">평균 이율</div></div>
   <div><div class="s-stat-val" id="stat-interest">₩0</div><div class="s-stat-lbl">예상 이자</div></div>
  </div>
 </div>
 <div class="section-hdr">
  <span class="section-lbl">저축 목록</span>
  <button class="btn-add" onclick="openAccountModal()">+ 추가</button>
 </div>
 <div class="this-month-bar" id="this-month-bar" hidden>
  <div class="tmb-title">📒 이번 달 가계부 저축</div>
  <div id="tmb-rows"></div>
 </div>
 <div class="cards" id="cards-list"></div>
</section>

<section class="page" id="page-budget">
 <div class="page-header">
  <div class="page-title">가계부</div>
  <div class="header-actions">
   <button class="icon-btn" onclick="openExportModal('budget')">📤 내보내기</button>
   <button class="icon-btn" onclick="openImportModal('budget')">📥 가져오기</button>
  </div>
 </div>
 <div class="member-tabs" id="budget-member-tabs"></div>
 <div class="month-nav">
  <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
  <span class="month-nav-label" id="month-label"></span>
  <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
 </div>
 <div class="budget-summary">
  <div class="bsum-card income">
   <div class="bsum-lbl">수입</div>
   <div class="bsum-val" id="bsum-income">₩0</div>
  </div>
  <div class="bsum-card expense">
   <div class="bsum-lbl">지출</div>
   <div class="bsum-val" id="bsum-expense">₩0</div>
  </div>
  <div class="bsum-card saving">
   <div class="bsum-lbl">저축</div>
   <div class="bsum-val" id="bsum-saving">₩0</div>
  </div>
 </div>
 <div class="net-card">
  <div class="net-row">
   <span class="net-label">잔액 (수입 − 지출 − 저축)</span>
   <span class="net-val" id="net-val">₩0</span>
  </div>
  <div class="net-bar-bg">
   <div class="net-bar-fill" id="net-bar"></div>
  </div>
 </div>
 <div class="budget-section">
  <div class="budget-section-head income-head" onclick="toggleSection('income')">
   <span>💰 수입</span><span id="income-total">₩0</span>
  </div>
  <div class="bsec-items" id="income-items"></div>
 </div>
 <div class="budget-section">
  <div class="budget-section-head expense-head" onclick="toggleSection('expense')">
   <span>💳 지출</span><span id="expense-total">₩0</span>
  </div>
  <div class="bsec-items" id="expense-items"></div>
 </div>
 <div class="budget-section">
  <div class="budget-section-head saving-head" onclick="toggleSection('saving')">
   <span>💰 저축</span><span id="saving-total">₩0</span>
  </div>
  <div class="bsec-items" id="saving-items"></div>
 </div>
</section>

<div class="modal-bg" id="modal-bg">
 <div class="modal">
  <div class="modal-handle"></div>
  <div class="modal-inner">
   <div class="modal-title" id="modal-title"></div>
   <div id="modal-content"></div>
   <div class="modal-actions" id="modal-actions">
    <button id="modal-cancel">취소</button>
    <button class="primary" id="modal-save">저장</button>
   </div>
  </div>
 </div>
</div>

<script>
"use strict";

/* 공통 */

const $=id=>document.getElementById(id);
const fmt=n=>'₩'+Math.round(Number(n)||0).toLocaleString('ko-KR');
const num=n=>Number(n)||0;
const comma=n=>num(n)>0?num(n).toLocaleString('ko-KR'):'';
const fromComma=s=>Number(String(s||'').replace(/[^0-9]/g,''))||0;

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 }[c]));
}
function read(key,fallback){
 try{
  const s=localStorage.getItem(key);
  return s===null?fallback:JSON.parse(s);
 }catch(e){return fallback}
}
function write(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value));
  return true;
 }catch(e){
  alert('저장에 실패했습니다. 브라우저 저장 공간을 확인하세요.');
  return false;
 }
}
function dateKey(d){
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+
 '-'+String(d.getDate()).padStart(2,'0');
}
function validDate(v){
 const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(!m)return false;
 const d=new Date(+m[1],+m[2]-1,+m[3]);
 return dateKey(d)===v;
}
function fullDate(s){
 const raw=String(s||'').trim();
 const digits=raw.replace(/\D/g,'');
 const value=digits.length===8
  ?digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8)
  :raw;
 return validDate(value)?value:null;
}
function savingDate(s,year){
 const raw=String(s||'').trim();
 if(!raw)return '';
 const digits=raw.replace(/\D/g,'');
 let value='';
 if(/^\d{8}$/.test(digits)){
  value=digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8);
 }else if(/^\d{4}$/.test(digits)){
  value=year+'-'+digits.slice(0,2)+'-'+digits.slice(2,4);
 }else{
  const m=raw.match(/^(\d{1,2})[\/.-](\d{1,2})$/);
  if(m)value=year+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  else{
   const f=raw.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/);
   if(f)value=f[1]+'-'+f[2].padStart(2,'0')+'-'+f[3].padStart(2,'0');
  }
 }
 return validDate(value)?value:null;
}
function shortDate(s){
 return validDate(s)?s.slice(5).replace('-','/'):'';
}
function monthKey(y,m){
 return y+'-'+String(m+1).padStart(2,'0');
}
function monthsBetween(a,b){
 if(!validDate(a)||!validDate(b))return 0;
 const x=a.split('-').map(Number),y=b.split('-').map(Number);
 return Math.max(0,(y[0]-x[0])*12+y[1]-x[1]);
}

function linkedAccountId(row,savingsMemberId){
 const list=accounts(savingsMemberId);

 // 명시적으로 저장된 연결 우선
 if(Object.prototype.hasOwnProperty.call(row,'linkedAccountId')&&
    row.linkedAccountId!==null&&row.linkedAccountId!==''){
  const acc=list.find(a=>String(a.id)===String(row.linkedAccountId));
  if(acc)return acc.id;
 }
 if(row.autoSavingsAccountId!=null){
  const acc=list.find(a=>String(a.id)===String(row.autoSavingsAccountId));
  if(acc)return acc.id;
 }

 const legacy=read('links_'+savingsMemberId,{});
 if(legacy[row.name]!=null){
  const acc=list.find(a=>String(a.id)===String(legacy[row.name]));
  if(acc)return acc.id;
 }

 // 이름 정확히 일치하는 계좌만 자동 연결
 const name=String(row.name||'').trim();
 if(!name)return null;

 const byProduct=list.filter(a=>String(a.name||'').trim()===name);
 if(byProduct.length===1)return byProduct[0].id;

 const byBank=list.filter(a=>String(a.bank||'').trim()===name);
 if(byBank.length===1)return byBank[0].id;

 // 상품명이 부분 일치하면서 후보가 하나뿐인 경우
 const partial=list.filter(a=>{
  const product=String(a.name||'').trim();
  return product&&(product.includes(name)||name.includes(product));
 });
 if(partial.length===1)return partial[0].id;

 return null;
}

function completedBudgetAmount(acc,savingsMemberId=activeId('savings')){
 const saver=members.savings.members.find(m=>m.id===savingsMemberId);
 if(!saver)return 0;
 const bm=members.budget.members.find(m=>m.id===saver.id&&m.name===saver.name)
 ||members.budget.members.find(m=>m.name===saver.name);
 if(!bm)return 0;

 let total=0;
 Object.values(budgetData(bm.id)).forEach(month=>{
  if(!Array.isArray(month?.saving))return;
  month.saving.forEach(row=>{
   if(row.completed!==true)return;
   if(String(linkedAccountId(row,savingsMemberId))!==String(acc.id))return;
   total+=Math.max(0,num(row.amount));
  });
 });
 return total;
}

function calcPaid(acc){
 return Math.max(0,
  num(acc.initBalance)+num(acc.extra)+
  num(acc.balanceAdjustment)+completedBudgetAmount(acc)
 );
}

function calcMaturity(acc){
 const paid=calcPaid(acc);
 if(!validDate(acc.start)||!validDate(acc.end))return paid;
 const remaining=Math.max(0,monthsBetween(dateKey(new Date()),acc.end));
 const monthly=num(acc.monthly);
 const rate=num(acc.rate)/1200;
 if(!rate)return paid+monthly*remaining;
 if(acc.interestType==='compound'){
  const factor=Math.pow(1+rate,remaining);
  return Math.round(paid*factor+monthly*(factor-1)/rate);
 }
 return Math.round(
  paid+monthly*remaining+
  paid*rate*remaining+
  monthly*rate*remaining*(remaining+1)/2
 );
}

function addPayment(id){
 const acc=accounts().find(a=>String(a.id)===String(id));
 if(!acc)return;
 showModal(acc.bank+' 추가 납입',`
  <div class="field"><label>납입 금액 (원)</label>
   <input id="extra-amount" type="number" inputmode="numeric" placeholder="100000">
  </div>
  <div class="field"><label>메모 (선택)</label>
   <input id="extra-memo" placeholder="추가 납입">
  </div>
 `,'납입 확인',()=>{
  const amount=num($('extra-amount').value);
  if(amount<=0){alert('금액을 입력해주세요.');return}
  acc.extra=num(acc.extra)+amount;
  saveSavings();closeModal();renderSavings();
 });
}

function deleteAccount(id){
 const acc=accounts().find(a=>String(a.id)===String(id));
 if(!acc)return;
 showModal('삭제 확인',`
  <p style="font-size:14px;color:var(--text2);line-height:1.7">
   ${esc(acc.bank)} ${esc(acc.name)} 계좌를 삭제할까요?
  </p>
 `,'삭제',()=>{
  savingsData().accounts=accounts().filter(a=>String(a.id)!==String(id));
  saveSavings();

  const key='links_'+activeId('savings');
  const links=read(key,{});
  Object.keys(links).forEach(name=>{
   if(String(links[name])===String(id))delete links[name];
  });
  write(key,links);

  const bm=matchedMember('savings','budget');
  if(bm){
   const data=budgetData(bm.id);
   Object.values(data).forEach(month=>{
    if(!Array.isArray(month?.saving))return;
    month.saving.forEach(row=>{
     if(String(row.linkedAccountId)===String(id)){
      row.linkedAccountId=null;
     }
     if(String(row.autoSavingsAccountId)===String(id)){
      delete row.autoSavingsAccountId;
     }
    });
   });
   write('budget_'+bm.id,data);
  }

  closeModal();renderSavings();
 });
}

/* 가계부 */

function totals(d){
 const income=sumRows(d.income);
 const expense=sumRows(d.expense.fixed)+sumRows(d.expense.flex);
 const saving=sumRows(d.saving);
 return {income,expense,saving,net:income-expense-saving};
}
function renderTotals(d){
 const t=totals(d);
 $('bsum-income').textContent=fmt(t.income);
 $('bsum-expense').textContent=fmt(t.expense);
 $('bsum-saving').textContent=fmt(t.saving);
 $('income-total').textContent=fmt(t.income);
 $('expense-total').textContent=fmt(t.expense);
 $('saving-total').textContent=fmt(t.saving);
 $('net-val').textContent=fmt(t.net);
 $('net-val').className='net-val '+(t.net>=0?'pos':'neg');
 $('net-bar').style.width=(t.income>0
  ?Math.max(0,Math.min(100,(t.income-t.net)/t.income*100))
  :0)+'%';
}
function renderBudget(){
 renderMembers('budget');
 const d=currentMonthData();
 $('month-label').textContent=`${budgetYear}년 ${budgetMonth+1}월`;
 renderTotals(d);
 renderRows('income-items',d.income,'income','');
 renderExpense(d);
 renderRows('saving-items',d.saving,'saving','');
}
function rowArray(sec,sub){
 const d=currentMonthData();
 return sec==='expense'?d.expense[sub]:d[sec];
}
function rowHTML(row,i,sec){
 const isSaving=sec==='saving';
 return `
  <div class="budget-row ${isSaving?'saving-row':''} ${row.completed?'completed':''}"
   data-row="${i}">
   <span class="drag-handle" data-drag>☰</span>
   ${sec!=='income'
    ?`<input type="checkbox" class="budget-check" data-check
      aria-label="${esc(row.name)} 완료" ${row.completed?'checked':''}>`
    :''}
   <div class="budget-row-label">
    ${isSaving
     ?`<span class="saving-name">${esc(row.name)}</span>
       <span class="saving-date-control">
        <input class="saving-date" data-date
         type="text" inputmode="numeric"
         maxlength="10" placeholder="MM/DD"
         value="${esc(shortDate(row.depositDate))}"
         aria-label="${esc(row.name)} 납입일">
       </span>`
     :esc(row.name)}
   </div>
   <input class="budget-amount" data-amount
    type="text" inputmode="numeric"
    value="${esc(comma(row.amount))}" placeholder="0"
    aria-label="${esc(row.name)} 금액">
   <button class="del-row-btn" data-delete aria-label="삭제">×</button>
  </div>`;
}
function renderRows(id,arr,sec,sub){
 const el=$(id);
 el.innerHTML=`<div class="budget-rows-grid">
  ${arr.map((r,i)=>rowHTML(r,i,sec)).join('')}
  <button class="add-row-btn" data-add>+ 항목 추가</button>
 </div>`;
 const grid=el.querySelector('.budget-rows-grid');
 wireRows(grid,sec,sub);
 grid.querySelector('[data-add]').onclick=()=>addRow(sec,sub);
}
function renderExpense(d){
 const el=$('expense-items');
 el.innerHTML=`
  <div class="sub-cat-label">고정비</div>
  <div class="budget-rows-grid" data-sub="fixed">
   ${d.expense.fixed.map((r,i)=>rowHTML(r,i,'expense')).join('')}
   <button class="add-row-btn" data-add>+ 고정비 추가</button>
  </div>
  <div class="sub-cat-label">유동비</div>
  <div class="budget-rows-grid" data-sub="flex">
   ${d.expense.flex.map((r,i)=>rowHTML(r,i,'expense')).join('')}
   <button class="add-row-btn" data-add>+ 유동비 추가</button>
  </div>`;
 for(const sub of ['fixed','flex']){
  const grid=el.querySelector(`[data-sub="${sub}"]`);
  wireRows(grid,'expense',sub);
  grid.querySelector('[data-add]').onclick=()=>addRow('expense',sub);
 }
}
function wireRows(grid,sec,sub){
 grid.querySelectorAll('.budget-row').forEach(el=>{
  const index=Number(el.dataset.row);
  const amount=el.querySelector('[data-amount]');

  amount.onfocus=()=>amount.select();
  amount.oninput=()=>{
   const raw=fromComma(amount.value);
   amount.value=raw?raw.toLocaleString('ko-KR'):'';
   const row=rowArray(sec,sub)[index];
   if(!row)return;
   row.amount=raw;
   if(row.autoSavingsAccountId!=null)row.manualOverride=true;
   saveBudget();renderTotals(currentMonthData());
  };

  const check=el.querySelector('[data-check]');
  if(check){
   check.onchange=()=>{
    const row=rowArray(sec,sub)[index];
    if(!row)return;
    row.completed=check.checked;
    saveBudget();
    el.classList.toggle('completed',check.checked);
    // 저축 체크 상태가 적금관리 반영 여부를 결정
   };
  }

  const date=el.querySelector('[data-date]');
  if(date){
   date.oninput=()=>{
    const digits=date.value.replace(/\D/g,'').slice(0,8);
    date.value=digits.length===4
     ?digits.slice(0,2)+'/'+digits.slice(2,4)
     :digits;
   };
   date.onblur=()=>{
    const row=rowArray('saving','')[index];
    if(!row)return;
    const value=savingDate(date.value,budgetYear);
    if(value===null){
     alert('날짜를 확인해주세요. 예: 1101 또는 11/01');
     date.value=shortDate(row.depositDate);
     return;
    }
    row.depositDate=value;
    saveBudget();
    date.value=shortDate(value);
   };
   date.onkeydown=e=>{
    if(e.key==='Enter')date.blur();
   };
  }

  el.querySelector('[data-delete]').onclick=()=>{
   rowArray(sec,sub).splice(index,1);
   saveBudget();renderBudget();
  };
 });

 installDrag(grid,'.budget-row',(from,to)=>{
  const arr=rowArray(sec,sub);
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  saveBudget();renderBudget();
 });
}
function toggleSection(sec){
 const el=$(sec+'-items');
 el.style.display=el.style.display==='none'?'':'none';
}
function addRow(sec,sub){
 const titles={
  income:'수입 항목 추가',
  saving:'저축 항목 추가',
  fixed:'고정비 항목 추가',
  flex:'유동비 항목 추가'
 };
 showModal(titles[sub]||titles[sec],`
  <div class="field">
   <label>항목 이름</label>
   <input id="row-name" placeholder="항목명">
  </div>
  <div class="field">
   <label>금액 (원, 선택)</label>
   <input id="row-amount" type="text" inputmode="numeric" placeholder="0">
  </div>
 `,'추가',()=>{
  const name=$('row-name').value.trim();
  if(!name){alert('항목 이름을 입력해주세요.');return}
  const amount=fromComma($('row-amount').value);
  if(sec==='saving'){
   rowArray(sec,sub).push({
    name,amount,completed:false,depositDate:''
   });
  }else{
   rowArray(sec,sub).push({name,amount,completed:false});
  }
  saveBudget();closeModal();renderBudget();
 });
}

/* 드래그 순서 변경 */

function installDrag(container,selector,onReorder){
 container.querySelectorAll('[data-drag]').forEach(handle=>{
  handle.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   e.preventDefault();e.stopPropagation();
   const item=handle.closest(selector);
   const rows=()=>[...container.querySelectorAll(selector)];
   const from=rows().indexOf(item);
   const rect=item.getBoundingClientRect();
   const y=e.clientY;
   let over=null;

   const ghost=item.cloneNode(true);
   ghost.style.cssText=`
    position:fixed;left:${rect.left}px;top:${rect.top}px;
    width:${rect.width}px;z-index:999;
    pointer-events:none;background:white;opacity:.85;
    box-shadow:0 8px 24px rgba(0,0,0,.18)
   `;
   document.body.appendChild(ghost);
   item.classList.add('dragging');

   function move(ev){
    if(ev.cancelable)ev.preventDefault();
    ghost.style.top=(rect.top+ev.clientY-y)+'px';
    const found=rows().filter(r=>r!==item).find(r=>{
     const b=r.getBoundingClientRect();
     return ev.clientY>=b.top&&ev.clientY<=b.bottom;
    })||null;
    if(found!==over){
     if(over)over.classList.remove('drag-over');
     over=found;
     if(over)over.classList.add('drag-over');
    }
   }
   function end(){
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    ghost.remove();
    item.classList.remove('dragging');
    if(over){
     over.classList.remove('drag-over');
     const to=rows().indexOf(over);
     if(from>=0&&to>=0&&from!==to)onReorder(from,to);
    }
   }
   document.addEventListener('pointermove',move,{passive:false});
   document.addEventListener('pointerup',end,{once:true});
   document.addEventListener('pointercancel',end,{once:true});
  });
 });
}

/* 데이터 가져오기 / 내보내기 */

function openExportModal(type){
 const data=type==='savings'
 ?{
  type:'savings',member:activeName(type),
  accounts:accounts(),nextId:savingsData().nextId,
  links:read('links_'+activeId(type),{})
 }
 :{
  type:'budget',member:activeName(type),data:budgetData()
 };

 showModal(type==='savings'?'적금 데이터 내보내기':'가계부 데이터 내보내기',`
  <div class="field">
   <label>현재 멤버: ${esc(activeName(type))}</label>
   <textarea id="export-text" rows="10" readonly
    style="font-size:12px;font-family:monospace;resize:vertical"></textarea>
  </div>
 `,'📋 복사',async()=>{
  const textarea=$('export-text');
  try{
   await navigator.clipboard.writeText(textarea.value);
   alert('복사되었습니다.');
  }catch(e){
   textarea.select();
   alert(document.execCommand('copy')
    ?'복사되었습니다.'
    :'자동 복사에 실패했습니다. 직접 선택해 복사해주세요.');
  }
 });
 $('export-text').value=JSON.stringify(data,null,2);
}
function openImportModal(type){
 showModal(type==='savings'?'적금 데이터 가져오기':'가계부 데이터 가져오기',`
  <div class="field">
   <label>데이터 붙여넣기</label>
   <textarea id="import-text" rows="8"
    style="font-size:12px;font-family:monospace"></textarea>
  </div>
  <div class="field">
   <label>가져올 위치</label>
   <select id="import-member">
    ${members[type].members.map(m=>`
     <option value="${esc(m.id)}">${esc(m.name)}</option>
    `).join('')}
    <option value="__new__">+ 새 멤버로 추가</option>
   </select>
  </div>
 `,'가져오기',()=>{
  let parsed;
  try{parsed=JSON.parse($('import-text').value)}
  catch(e){alert('데이터 형식이 올바르지 않습니다.');return}

  if(parsed?.type!==type){
   alert('선택한 메뉴의 데이터가 아닙니다.');return;
  }
  if(type==='savings'&&!Array.isArray(parsed.accounts)){
   alert('적금 계좌 데이터가 없습니다.');return;
  }
  if(type==='budget'&&
   (!parsed.data||typeof parsed.data!=='object'||Array.isArray(parsed.data))){
   alert('가계부 데이터 형식이 올바르지 않습니다.');return;
  }

  const target=$('import-member').value;
  if(target!=='__new__'&&!confirm('선택한 멤버의 기존 데이터를 덮어쓸까요?'))return;
  const id=target==='__new__'
   ?'m'+Date.now()+'_'+Math.random().toString(36).slice(2,6)
   :target;

  if(type==='savings'){
   if(!write('savings_'+id,{
    accounts:parsed.accounts,nextId:num(parsed.nextId)||1
   }))return;
   write('links_'+id,parsed.links||{});
  }else{
   if(!write('budget_'+id,parsed.data))return;
  }
  delete cache[type+'_'+id];

  if(target==='__new__'){
   members[type].members.push({
    id,name:String(parsed.member||'가져온 멤버')
   });
  }
  members[type].active=id;
  saveMembers();closeModal();applyColor(type);renderAll();
  alert('가져오기 완료!');
 });
}

/* 초기화 */

function renderAll(){
 renderSavings();
 renderBudget();
}
saveMembers();
applyColor('savings');
renderAll();

// 좌우 스와이프 탭 이동
(function(){
 let sx=null,sy=0;
 document.addEventListener('touchstart',e=>{
  if(document.querySelector('.modal-bg.open'))return;
  if(e.target.closest('input,select,textarea,.drag-handle,.member-tabs'))return;
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
 },{passive:true});
 document.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;
  const dy=e.changedTouches[0].clientY-sy;
  sx=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
  if(dx<0&&activeTab==='savings')switchTab('budget');
  else if(dx>0&&activeTab==='budget')switchTab('savings');
 },{passive:true});
})();

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
